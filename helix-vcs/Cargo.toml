[package]
name = "helix-vcs"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
helix-core = { path = "../helix-core" }
helix-event = { path = "../helix-event" }

tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "parking_lot", "macros"] }
parking_lot.workspace = true
arc-swap = { version = "1.7.1" }

# "parallel" matters for the changed-file scan: without it gix's status
# iterator buffers every item and yields them only when the whole scan finishes
# (its non-parallel path collects into a Vec), and the index<->worktree
# modification checks all run on one thread — ~13s on the first `space g` over a
# large repo on NFS, vs ~50ms parallel.
gix = { version = "0.74.1", features = ["attributes", "status", "parallel"], default-features = false, optional = true }
# Untracked files are enumerated with the parallel `ignore` walker rather than
# gix's single-threaded dirwalk: on a network filesystem the concurrent I/O
# hides per-entry latency (~1.8s vs ~3s+ for a few thousand untracked files).
ignore = { version = "0.4", optional = true }
imara-diff =  "0.2.0"
anyhow = "1"

log = "0.4"

[features]
git = ["gix", "ignore"]

[dev-dependencies]
tempfile.workspace = true
